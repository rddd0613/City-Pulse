<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111319" />
    <!-- Full-screen on iPhone when added to the Home Screen, with the page
         drawn under the status bar (safe areas are handled in CSS). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="City Pulse" />
    <meta name="format-detection" content="telephone=no" />
    <title>City Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      If this page is opened directly (double-click, or VS Code "Live Server")
      the JSX source cannot run and the screen stays empty. This note then
      explains how to start the app with Vite. It never shows when Vite runs.
    -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="max-width:420px;margin:48px auto;padding:20px;font:14px/1.7 system-ui,sans-serif;color:#e8e9ec;background:#191c21;border-radius:12px">' +
            '<b>City Pulse is not running through Vite.</b><br>' +
            'In the VS Code terminal, inside the project folder, run:<br>' +
            '<code>npm install</code><br><code>npm run dev</code><br>' +
            'then open the address it prints (http://localhost:5173).' +
            '<hr style="border-color:#333">' +
            '<div dir="rtl"><b>التطبيق ما اشتغل عن طريق Vite.</b><br>' +
            'افتحي الترمنال في VS Code داخل مجلد المشروع واكتبي:<br>' +
            '<code>npm install</code><br><code>npm run dev</code><br>' +
            'وافتحي الرابط اللي يطلع (http://localhost:5173).</div></div>';
        }
      }, 4000);
    </script>
  </body>
</html>
